<!DOCTYPE html>
<html>
<body>
<p id = "demo"></p>
<p id = "addnum"></p>
<p id = "subnum"></p>
<script>
  const hello = (val) => "Anantha" + val;
document.getElementById("demo").innerHTML = hello("Lakshmi");
const addTwonumbers = (num1, num2) => num1 + num2;
document.getElementById("addnum").innerHTML = addTwonumbers(10,20);
document.write(addTwonumbers(10,20))
console.log(addTwonumbers(10,20))
alert(addTwonumbers(10,20))
//subtract Two numbers using arrow functions
document.write("<br>");
const subTwonumbers = (num1, num2) => num1 - num2;
document.getElementById("subnum").innerHTML = subTwonumbers(10,20);
document.write(subTwonumbers(10,20))
console.log(subTwonumbers(10,20))
alert(subTwonumbers(10,20))
</script>
</body>
</html>
